; The watch-progress stream runs for up to an hour and must reach the client frame by frame
max_execution_time = 0
output_buffering = 0

memory_limit = 256M

; Episode video uploads
upload_max_filesize = 64G
post_max_size = 64G

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
